name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - target: win

    name: Build ${{ matrix.config.target }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: geode-sdk/build-geode-mod-docker@main
        with:
          target: ${{ matrix.config.target }}
          upload: true
          sdk: 'latest'
          export-pdb: true
          build-config: ${{ matrix.config.target == 'win' && 'RelWithDebInfo' || 'Release' }}

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod-docker/merge@main
        with:
          upload: true
